[tool.poetry]
name = "dasf"
version = "1.1"
description = "DASF is an Accelerated Framework for Machine Learning"
authors = ["Julio Faracco <jcfaracco@gmail.com>"]
maintainers = ["Julio Faracco <jcfaracco@gmail.com>"]
license = "MIT"
homepage = "https://github.com/discovery-unicamp/dasf-core"
repository = "https://github.com/discovery-unicamp/dasf-core"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
readme="README.md"
exclude = ["tests/*", "docs/*"]

[tool.poetry.dependencies]
bokeh = "3.9.2"
dask = "2026.7.1"
distributed = "2026.7.1"
dask_cuda = "26.10.0"
dask_ml = "2025.1.0"
dask_memusage = "1.1"
dask_jobqueue = "0.9.0"
xarray = "2026.9.0"
GPUtil = "1.4.0"
gdown = "6.4.2"
graphviz = "0.21"
h5py = "3.16.0"
hdbscan = "0.8.44"
ipympl = "0.10.0"
ipywidgets = "8.1.9"
joblib = "1.5.3"
jupyterlab = "4.5.4"
lightning = "2.6.6"
matplotlib = "3.10.8"
memray = "1.20.0"
networkx = "3.6.1"
numpy = "2.3.5"
cupy = "14.2.0"
ormsgpack = "1.13.0"
packaging = "25.0"
pandas = "2.3.3"
portalocker = "4.4.2"
protobuf = "6.33.5"
tornado = "6.5.4"
xgboost = "3.4.1"
scikit-learn = "1.8.0"
imageio = "2.38.1"
zarr = "3.4.2"
Pygments = "2.17.2"


[tool.poetry.group.dev.dependencies]
black = "*"
coverage = "*"
flake8 = "*"
hpccm = "*"
interrogate = "*"
isort = "*"
nvtx = "*"
parameterized = "*"
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
wheel = "*"

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-autoapi = "*"
sphinx_rtd_theme = "*"
nbsphinx = "*"
pandoc = "*"

[tool.isort]
profile = "black"

[tool.coverage.paths]
source = ["dasf", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["dasf"]

[tool.coverage.report]
exclude_also = [
    "except ImportError",
    ".*NV_COMP.*",
    ".*kvikio.*",
    ".*KVIKIO.*",
    ".*jax.*",
    ".*JAX.*",
    ]

[build-system]
requires = ["poetry-core>=1.1.10"]
build-backend = "poetry.core.masonry.api"
