[project]
name = "dasf"
version = "1.1"
description = "DASF is an Accelerated Framework for Machine Learning"
authors = [
    { name = "Julio Faracco", email = "jcfaracco@gmail.com" },
]
maintainers = [
    { name = "Julio Faracco", email = "jcfaracco@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "bokeh==3.9.2",
    "dask==2026.7.1",
    "distributed==2026.7.1",
    "dask_cuda==26.10.0",
    "dask_ml==2025.1.0",
    "dask_memusage==1.1",
    "dask_jobqueue==0.9.0",
    "xarray==2026.9.0",
    "GPUtil==1.4.0",
    "gdown==6.5.1",
    "graphviz==0.21",
    "h5py==3.16.0",
    "hdbscan==0.8.44",
    "ipympl==0.10.0",
    "ipywidgets==8.1.9",
    "joblib==1.5.3",
    "jupyterlab==4.6.6",
    "lightning==2.6.6",
    "matplotlib==3.11.2",
    "memray==1.20.0",
    "networkx==3.7",
    "numpy==2.3.5",
    "ormsgpack==1.13.0",
    "packaging==25.0",
    "pandas==2.3.3",
    "portalocker==4.4.2",
    "protobuf==6.33.5",
    "tornado==6.6",
    "xgboost==3.4.1",
    "scikit-learn==1.9.1",
    "imageio==2.38.1",
    "zarr==3.4.2",
    "Pygments==2.17.2",
]

[project.optional-dependencies]
gpu = [
    "cupy==14.2.0",
]

[project.urls]
Homepage = "https://github.com/discovery-unicamp/dasf-core"
Repository = "https://github.com/discovery-unicamp/dasf-core"

[dependency-groups]
dev = [
    "black",
    "coverage",
    "flake8",
    "hpccm",
    "interrogate",
    "isort",
    "nvtx",
    "parameterized",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "wheel",
]
docs = [
    "sphinx",
    "sphinx-autoapi",
    "sphinx_rtd_theme",
    "nbsphinx",
    "pandoc",
]

[tool.isort]
profile = "black"

[tool.coverage.paths]
source = ["dasf", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["dasf"]

[tool.coverage.report]
exclude_also = [
    "except ImportError",
    ".*NV_COMP.*",
    ".*kvikio.*",
    ".*KVIKIO.*",
    ".*jax.*",
    ".*JAX.*",
    ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dasf"]
